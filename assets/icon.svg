<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2338"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fb0f0"/>
      <stop offset="1" stop-color="#2f6cb0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="12" fill="url(#plate)" stroke="#2b3a58" stroke-width="3"/>

  <!-- Feed lines being filtered down to signal -->
  <g fill="url(#accent)">
    <rect x="26" y="30" width="76" height="9" rx="4"/>
    <rect x="26" y="49" width="58" height="9" rx="4" opacity="0.72"/>
    <rect x="26" y="68" width="40" height="9" rx="4" opacity="0.48"/>
    <rect x="26" y="87" width="24" height="9" rx="4" opacity="0.28"/>
  </g>

  <!-- Accent bar marking the kept row -->
  <rect x="16" y="28" width="5" height="13" rx="2" fill="#6fb0f0"/>
</svg>
