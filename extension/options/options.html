<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>GLP Ultra options</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="mark">GLP</span>
            <div>
                <h1>GLP Ultra</h1>
                <p id="subtitle">Every control, in one place.</p>
            </div>
        </div>
        <div class="topbar-actions">
            <input type="search" id="search" placeholder="Search settings, filters, theme, media..." autocomplete="off">
            <button type="button" class="btn" id="export">Export</button>
            <button type="button" class="btn" id="import">Import</button>
            <button type="button" class="btn danger" id="reset">Reset</button>
        </div>
    </header>

    <main id="sections" class="sections"></main>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <input type="file" id="import-file" accept="application/json" hidden>

    <script src="../generated/settings-schema.js"></script>
    <script src="options.js"></script>
</body>
</html>
